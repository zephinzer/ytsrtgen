basePath: /
definitions:
  main.errorResponse:
    properties:
      error:
        type: string
    type: object
  main.request:
    properties:
      data:
        description: Data is the video URL to fetch subtitles for.
        example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        type: string
    type: object
info:
  contact: {}
  description: Fetches auto-generated English subtitles for a video URL via yt-dlp.
  title: ytsrtgen API
  version: "1.0"
paths:
  /:
    post:
      consumes:
      - application/json
      description: Runs yt-dlp against the supplied URL and returns the English subtitles
        in the requested format.
      parameters:
      - default: srt
        description: Output format
        enum:
        - srt
        - txt
        in: query
        name: format
        type: string
      - description: Video URL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.request'
      produces:
      - text/plain
      responses:
        "200":
          description: Subtitle content in the requested format
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: Generate subtitles for a video URL
swagger: "2.0"
